<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tigist Quotes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quote-container">
        <h2>ጥቅሶች / Quotes</h2>
        <div class="quote-card">
            <p id="am-text" class="amharic-text">እየጫነ ነው...</p>
            <p id="en-text" class="english-text">Loading...</p>
            <h4 id="author" class="author"></h4>
        </div>
        
        <!-- ሁለቱም ቁልፎች (Previous እና Next) -->
        <div class="buttons-container">
            <button id="prev-btn">ያለፈው (Previous)</button>
            <button id="next-btn">ቀጣይ (Next)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
