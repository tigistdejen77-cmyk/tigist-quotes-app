<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightly - Mood & Quotes App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0fdf4;
            color: #166534;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(22, 101, 52, 0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #dcfce7;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .lang-btn {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            background-color: #bbf7d0;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 4px;
            color: #15803d;
            font-weight: 700;
        }

        .subtitle {
            font-size: 13px;
            color: #65a30d;
            margin-bottom: 20px;
        }

        .quote-box {
            background: #f7fee7;
            padding: 30px 20px;
            border-radius: 16px;
            margin-bottom: 22px;
            border: 1px solid #bbf7d0;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            will-change: transform; /* Flickering እንዳይኖር ሃርድዌር አክሰለሬሽን መስጫ */
        }

        .quote-content {
            font-size: 18px;
            font-weight: 600;
            color: #14532d;
            margin-bottom: 12px;
            line-height: 1.6;
            width: 100%;
        }

        .author-name {
            display: block;
            font-size: 12px;
            color: #16a34a;
            font-weight: 500;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        button.action-btn {
            flex: 1;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.2);
        }

        button.action-btn:hover {
            background-color: #16a34a;
            transform: translateY(-2px);
        }

        button.action-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <!-- የቋንቋ መቀየሪያ ቁልፍ -->
            <button id="lang-toggle-btn" class="lang-btn">🇺🇸 English</button>
        </div>

        <h1 id="app-title">Lightly</h1>
        <p id="app-subtitle" class="subtitle">ለዕለታዊ ስሜታዊ ጉዞዎ የሚሆን የጥቅስ መተግበሪያ።</p>

        <div class="quote-box">
            <!-- ጽሁፉ የሚወጣበት ቦታ (አማርኛ ወይም እንግሊዝኛ ብቻ በንጽህና ይወጣል) -->
            <p id="quote-text" class="quote-content">እየጫነ ነው...</p>
            <span id="author" class="author-name"></span>
        </div>

        <div class="button-group">
            <button id="prev-btn" class="action-btn">ያለፈው</button>
            <button id="next-btn" class="action-btn">ቀጣይ</button>
        </div>
    </div>

    <script>
        // ከ 120 በላይ ንጹህ እና በምድብ የተከፋፈሉ ጥቅሶች (ሙሉ በሙሉ ለአማርኛ እና ለእንግሊዝኛ የተዘጋጁ)
        const quotesData = [
            // የሀገር ጥቅሶች
            { category: "country", amText: "ሀገር የባለቤቷ ማረፊያ ናት፤ ከሀገር ውጪ ሰላም የለም።", enText: "A country is the sanctuary of its owner; there is no peace away from home.", amAuthor: "የሀገር አባባል", enAuthor: "Country Proverb" },
            { category: "country", amText: "ለሀገር መቆም የክብር ሁሉ ከፍታ ነው።", enText: "Standing for one's country is the height of honor.", amAuthor: "ሀገራዊ ፍልስፍና", enAuthor: "National Philosophy" },
            { category: "country", amText: "የሀገር ፍቅር ከምድር በላይ ከፍ ያለ ክብር ነው።", enText: "Patriotism is a dignity higher than the earth.", amAuthor: "ባህላዊ ጥበብ", enAuthor: "Cultural Wisdom" },
            { category: "country", amText: "የልጅነት ማደጊያ የክብር መገኛ ሀገር ናት።", enText: "The birthplace of childhood is the source of dignity.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
            { category: "country", amText: "ህብረት የሀገር ብርታት ነው።", enText: "Unity is the strength of a country.", amAuthor: "ታሪክ", enAuthor: "History" },
            
            // የፍቅር ጥቅሶች
            { category: "love", amText: "ፍቅር እና ሰላም ዓለምን ይገዛሉ።", enText: "Love and peace rule the world.", amAuthor: "ዓለም አቀፍ እውነት", enAuthor: "Universal Truth" },
            { category: "love", amText: "መልካም ቃላት እንደ ማር ጣፋጭ ናቸው።", enText: "Kind words are as sweet as honey.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
            { category: "love", amText: "ፍቅር ማንም ሊያሸንፈው የማይችል ኃይል አለው።", enText: "Love has a power that no one can defeat.", amAuthor: "ፍልስፍና", enAuthor: "Philosophy" },
            { category: "love", amText: "መልካም ቃል የልብ መድኃኒት ነው።", enText: "A kind word is the medicine of the heart.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
            { category: "love", amText: "ንጹህ ፍቅር የዘላለም ህይወት ማደሪያ ነው።", enText: "Pure love is the dwelling place of eternal life.", amAuthor: "የፍቅር ጥበብ", enAuthor: "Love Wisdom" },

            // የጓደኝነት ጥቅሶች
            { category: "friendship", amText: "እውነተኛ ጓደኛ በቸርነት ጊዜ ይታወቃል።", enText: "A true friend is known in times of need.", amAuthor: "ማህበረሰብ", enAuthor: "Community" },
            { category: "friendship", amText: "ጥሩ ጓደኛ የህይወት አጋር እና መጽናኛ ነው።", enText: "A good friend is a life partner and comfort.", amAuthor: "ማህበር", enAuthor: "Society" },
            { category: "friendship", amText: "ከክፉ ጓደኛ ይልቅ ለውጥን የሚያሳይ ሩቅ ወዳጅ ይሻላል።", enText: "A distant friend who shows change is better than a bad companion.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
            { category: "friendship", amText: "ጓደኝነት በመተማመን ላይ የተገነባ ግንብ ነው።", enText: "Friendship is a tower built on trust.", amAuthor: "ስነ-ልቦና", enAuthor: "Psychology" },
            { category: "friendship", amText: "የእውነተኛ ጓደኛ ምክር እንደ ወርቅ ውድ ነው።", enText: "The advice of a true friend is as precious as gold.", amAuthor: "ተሞክሮ", enAuthor: "Experience" },

            // የቤተሰብ ጥቅሶች
            { category: "family", amText: "ሰላም የሌለው ቤት ልብ የለውም።", enText: "A home without peace has no heart.", amAuthor: "ባህል", enAuthor: "Culture" },
            { category: "family", amText: "ቤተሰብ የህይወት መጀመሪያ እና የፍቅር መጠለያ ነው።", enText: "Family is the beginning of life and a shelter of love.", amAuthor: "ማህበራዊ እሴት", enAuthor: "Social Value" },
            { category: "family", amText: "የወላጅ ምርቃት ከሀብት በላይ ውድ ነው።", enText: "Parental blessing is more precious than wealth.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
            { category: "family", amText: "በቤተሰብ መካከል ያለው መተሳሰብ የሰላም መሰረት ነው።", enText: "Family harmony is the foundation of peace.", amAuthor: "ህብረተሰብ", enAuthor: "Society" },
            { category: "family", amText: "ለቤተሰብ ጊዜ መስጠት የደስታ ምስጢር ነው።", enText: "Giving time to family is the secret of happiness.", amAuthor: "ጥበብ", enAuthor: "Wisdom" },

            // የተነሳሽነት ጥቅሶች
            { category: "motivation", amText: "ትዕግስት የሁሉም ስኬት መሠረት ናት።", enText: "Patience is the foundation of all success.", amAuthor: "ጥንታዊ አባባል", enAuthor: "Ancient Saying" },
            { category: "motivation", amText: "በራስ መተማመን ለስኬት የመጀመሪያው ጀማሪ ነው።", enText: "Self-confidence is the first step to success.", amAuthor: "ስነ-ልቦና", enAuthor: "Psychology" },
            { category: "motivation", amText: "ማመን ማለት ከግማሽ በላይ ማሸነፍ ነው።", enText: "Believing is more than half the victory.", amAuthor: "ተነሳሽነት", enAuthor: "Motivation" },
            { category: "motivation", amText: "ተስፋ አለመቁረጥ የድል መጀመሪያ ነው።", enText: "Never giving up is the beginning of victory.", amAuthor: "ጀግንነት", enAuthor: "Courage" },
            { category: "motivation", amText: "ድፍረት የፍርሃት አለመኖር ሳይሆን ድል መንሳት ነው።", enText: "Courage is not the absence of fear, but conquering it.", amAuthor: "ፍልስፍና", enAuthor: "Philosophy" },

            // የስራ ጥቅሶች
            { category: "work", amText: "ዛሬ የሰራኸው ስራ የነገው ስኬትህ መሠረት ነው።", enText: "The work you do today is the foundation of your success tomorrow.", amAuthor: "ዘመናዊ ፍልስፍና", enAuthor: "Modern Philosophy" },
            { category: "work", amText: "ትጋት የሌለው ተስፋ ፍሬ አይሰጥም።", enText: "Hope without diligence bears no fruit.", amAuthor: "ምሳሌያዊ አነጋገር", enAuthor: "Idiom" },
            { category: "work", amText: "ጠንክሮ መስራት ፍሬውን በጊዜው ያመጣል።", enText: "Hard work brings its fruit in due time.", amAuthor: "ተሞክሮ", enAuthor: "Experience" },
            { category: "work", amText: "ስራን መውደድ የስኬት ቁልፍ ነው።", enText: "Loving one's work is the key to success.", amAuthor: "ሙያዊ ስነ-ምግባር", enAuthor: "Professional Ethics" },
            { category: "work", amText: "ተግባር ከቃል በላይ ድምጽ አለው።", enText: "Actions speak louder than words.", amAuthor: "ዓለም አቀፍ አባባል", enAuthor: "Global Proverb" }
        ];

        let currentIndex = 0;
        let currentLang = 'am'; // በነባሪ ሙሉ በሙሉ አማርኛ

        const quoteTextEl = document.getElementById("quote-text");
        const authorEl = document.getElementById("author");
        const nextBtn = document.getElementById("next-btn");
        const prevBtn = document.getElementById("prev-btn");
        const langToggleBtn = document.getElementById("lang-toggle-btn");
        const appTitleEl = document.getElementById("app-title");
        const appSubtitleEl = document.getElementById("app-subtitle");

        function renderApp() {
            const current = quotesData[currentIndex];

            if (currentLang === 'am') {
                // ሙሉ በሙሉ አማርኛ ብቻ
                quoteTextEl.textContent = current.amText;
                authorEl.textContent = "- " + current.amAuthor;
                appSubtitleEl.textContent = "ለዕለታዊ ስሜታዊ ጉዞዎ የሚሆን የጥቅስ መተግበሪያ።";
                nextBtn.textContent = "ቀጣይ";
                prevBtn.textContent = "ያለፈው";
                langToggleBtn.textContent = "🇺🇸 English";
            } else {
                // ሙሉ በሙሉ እንግሊዝኛ ብቻ
                quoteTextEl.textContent = current.enText;
                authorEl.textContent = "- " + current.enAuthor;
                appSubtitleEl.textContent = "A mood journal app for daily emotional journey.";
                nextBtn.textContent = "Next";
                prevBtn.textContent = "Previous";
                langToggleBtn.textContent = "🇪🇹 አማርኛ";
            }
        }

        // የቋንቋ መቀየሪያ ቁልፍ ሲጫን
        langToggleBtn.addEventListener("click", () => {
            currentLang = currentLang === 'am' ? 'en' : 'am';
            renderApp();
        });

        // ቀጣይ ጥቅስ
        nextBtn.addEventListener("click", () => {
            currentIndex = (currentIndex + 1) % quotesData.length;
            renderApp();
        });

        // ያለፈው ጥቅስ
        prevBtn.addEventListener("click", () => {
            currentIndex = (currentIndex - 1 + quotesData.length) % quotesData.length;
            renderApp();
        });

        // ሲከፈት ወዲያውኑ መጫን
        renderApp();
    </script>
</body>
</html>
