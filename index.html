<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tigist Quotes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>ዕለታዊ የህይወት ጥቅሶች</h1>
        <p class="subtitle">Daily Life Quotes</p>

        <div class="quote-box">
            <p id="am-text" class="am-quote">እየጫነ ነው...</p>
            <p id="en-text" class="en-quote">Loading...</p>
            <span id="author" class="author-name"></span>
        </div>

        <div class="button-group">
            <button id="prev-btn">ያለፈው (Previous)</button>
            <button id="next-btn">ቀጣይ (Next)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
