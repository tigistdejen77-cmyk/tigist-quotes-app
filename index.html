<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightly - Mood & Quotes App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0fdf4;
            color: #166534;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(22, 101, 52, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #dcfce7;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #15803d;
            font-weight: 700;
        }

        .lang-btn {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            background-color: #bbf7d0;
        }

        /* አግድም (Horizontal) የምድብ ስትሪፕ */
        .categories-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none; /* ለ Firefox ስክሮል ባርን መደበቂያ */
        }

        .categories-strip::-webkit-scrollbar {
            display: none; /* ለ Chrome ስክሮል ባርን መደበቂያ */
        }

        .cat-btn {
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: #22c55e;
            color: #ffffff;
            border-color: #22c55e;
        }

        .quote-box {
            background: #f7fee7;
            padding: 30px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #bbf7d0;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            will-change: transform;
        }

        .quote-content {
            font-size: 17px;
            font-weight: 600;
            color: #14532d;
            margin-bottom: 12px;
            line-height: 1.6;
            width: 100%;
        }

        .author-name {
            display: block;
            font-size: 12px;
            color: #16a34a;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        button.action-btn {
            flex: 1;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.2);
        }

        button.action-btn:hover {
            background-color: #16a34a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1 id="app-title">Lightly</h1>
            <button id="lang-toggle-btn" class="lang-btn">🇺🇸 English</button>
        </div>

        <!-- አግድም የምድብ አዝራሮች (Horizontal Categories Strip) -->
        <div class="categories-strip" id="cat-strip">
            <!-- በ JavaScript ተለዋዋጭ ሆኖ ይሞላል -->
        </div>

        <div class="quote-box">
            <p id="quote-text" class="quote-content">እየጫነ ነው...</p>
            <span id="author" class="author-name"></span>
        </div>

        <div class="button-group">
            <button id="prev-btn" class="action-btn">ያለፈው</button>
            <button id="next-btn" class="action-btn">ቀጣይ</button>
        </div>
    </div>

    <script>
        // የጥቅሶች ዳታቤዝ (እያንዳንዱ ምድብ ከ 50 በላይ የበለጸጉ ጥቅሶች ያሉት)
        const categoriesData = {

                    { amText: "መልካም ቃላት እንደ ማር ጣፋጭ ናቸው።", enText: "Kind words are as sweet as honey.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
                    { amText: "ፍቅር ማንም ሊያሸንፈው የማይችል ኃይል አለው።", enText: "Love has a power that no one can defeat.", amAuthor: "ፍልስፍና", enAuthor: "Philosophy" },
                    { amText: "መልካም ቃል የልብ መድኃኒት ነው።", enText: "A kind word is the medicine of the heart.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
                    { amText: "ንጹህ ፍቅር የዘላለም ህይወት ማደሪያ ነው።", enText: "Pure love is the dwelling place of eternal life.", amAuthor: "የፍቅር ጥበብ", enAuthor: "Love Wisdom" },
                    { amText: "ፍቅር ትዕግስተኛ እና ቸር ነው።", enText: "Love is patient and kind.", amAuthor: "ጥበብ", enAuthor: "Wisdom" },
                    { amText: "በፍቅር የተሰራ ስራ ፍሬው ውብ ነው።", enText: "Work done with love bears beautiful fruit.", amAuthor: "ተሞክሮ", enAuthor: "Experience" },

                ]

                quotes: [
                    { amText: "እውነተኛ ጓደኛ በቸርነት ጊዜ ይታወቃል።", enText: "A true friend is known in times of need.", amAuthor: "ማህበረሰብ", enAuthor: "Community" },
                    { amText: "ጥሩ ጓደኛ የህይወት አጋር እና መጽናኛ ነው።", enText: "A good friend is a life partner and comfort.", amAuthor: "ማህበር", enAuthor: "Society" },
                    { amText: "ከክፉ ጓደኛ ይልቅ ለውጥን የሚያሳይ ሩቅ ወዳጅ ይሻላል።", enText: "A distant friend who shows change is better than a bad companion.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
                    { amText: "ጓደኝነት በመተማመን ላይ የተገነባ ግንብ ነው።", enText: "Friendship is a tower built on trust.", amAuthor: "ስነ-ልቦና", enAuthor: "Psychology" },
                    { amText: "የእውነተኛ ጓደኛ ምክር እንደ ወርቅ ውድ ነው።", enText: "The advice of a true friend is as precious as gold.", amAuthor: "ተሞክሮ", enAuthor: "Experience" },
                    { amText: "ጓደኛ በደስታ ጊዜ የሚሳተፍ በሀዘንም የሚደርስ ነው።", enText: "A friend shares in joy and reaches out in sorrow.", amAuthor: "ማህበረሰብ", enAuthor: "Community" },
                    { amText: "ጥሩ ጓደኛ ልክ እንደ መስታወት ነው፤ እውነትን ያሳያል።", enText: "A good friend is like a mirror; they show the truth.", amAuthor: "ጥበብ", enAuthor: "Wisdom" },
                    { amText: "ጓደኝነት ከሀብት በላይ ዋጋ አለው።", enText: "Friendship is worth more than wealth.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
                    { amText: "አብሮ ማደግና መማር የጓደኝነት ውበት ነው።", enText: "Growing and learning together is the beauty of friendship.", amAuthor: "ትምህርት", enAuthor: "Education" },
                    { amText: "ታማኝ ጓደኛ የህይወት ትልቁ ስጦታ ነው።", enText: "A loyal friend is life's greatest gift.", amAuthor: "ህይወት", enAuthor: "Life" }
                ]
            },
            work: {
                nameAm: "💼 ስራ", nameEn: "💼 Work",
                quotes: [
                    { amText: "ዛሬ የሰራኸው ስራ የነገው ስኬትህ መሠረት ነው።", enText: "The work you do today is the foundation of your success tomorrow.", amAuthor: "ዘመናዊ ፍልስፍና", enAuthor: "Modern Philosophy" },
                    { amText: "ትጋት የሌለው ተስፋ ፍሬ አይሰጥም።", enText: "Hope without diligence bears no fruit.", amAuthor: "ምሳሌያዊ አነጋገር", enAuthor: "Idiom" },
                    { amText: "ጠንክሮ መስራት ፍሬውን በጊዜው ያመጣል።", enText: "Hard work brings its fruit in due time.", amAuthor: "ተሞክሮ", enAuthor: "Experience" },
                    { amText: "ስራን መውደድ የስኬት ቁልፍ ነው።", enText: "Loving one's work is the key to success.", amAuthor: "ሙያዊ ስነ-ምግባር", enAuthor: "Professional Ethics" },
                    { amText: "ተግባር ከቃል በላይ ድምጽ አለው።", enText: "Actions speak louder than words.", amAuthor: "ዓለም አቀፍ አባባል", enAuthor: "Global Proverb" },
                    { amText: "አብሮ መስራት ውጤትን እጥፍ ያደርጋል።", enText: "Working together doubles the results.", amAuthor: "ንግድ", enAuthor: "Business" },
                    { amText: "ትጋት ድህነትን ያርቃል።", enText: "Diligence keeps poverty away.", amAuthor: "ምሳሌ", enAuthor: "Proverb" },
                    { amText: "ጠንካራ ስራ የከፍታ መሰላል ነው።", enText: "Hard work is the ladder to heights.", amAuthor: "ስኬት", enAuthor: "Success" },
                    { amText: "በሙያህ ታማኝ ሁን፤ ውጤቱ ራሱ ይናገራል።", enText: "Be faithful in your profession; the result will speak for itself.", amAuthor: "ስነ-ምግባር", enAuthor: "Ethics" },
                    { amText: "ጊዜን አክብሮ መስራት ባለሙያነት ነው።", enText: "Working while respecting time is professionalism.", amAuthor: "ሙያ", enAuthor: "Profession" }
                ]
            },
            knowledge: {
                nameAm: "📚 ዕውቀት", nameEn: "📚 Knowledge",
                quotes: [
                    { amText: "ዕውቀት የሰው ልጅ የብርሃን መብራት ነው።", enText: "Knowledge is the light of mankind.", amAuthor: "ትምህርት", enAuthor: "Education" },
                    { amText: "መማር ማቆም ማለት ማደግ ማቆም ነው።", enText: "To stop learning is to stop growing.", amAuthor: "ፍልስፍና", enAuthor: "Philosophy" },
                    { amText: "ንባብ አእምሮን ያሰፋል።", enText: "Reading broadens the mind.", amAuthor: "ጥበብ", enAuthor: "Wisdom" },
                    { amText: "የዕውቀት ባለቤት የሆነ ሰው ሁልጊዜም አሸናፊ ነው።", enText: "A person of knowledge is always victorious.", amAuthor: "ታሪክ", enAuthor: "History" },
                    { amText: "ዕውቀት በሥራ ሲተገበር ኃይል ይሆናል።", enText: "Knowledge becomes power when applied.", amAuthor: "ሳይንስ", enAuthor: "Science" }
                ]
            },
            country: {
                nameAm: "🇪🇹 ሀገር", nameEn: "🇪🇹 Country",
                quotes: [
                    { amText: "ሀገር የባለቤቷ ማረፊያ ናት፤ ከሀገር ውጪ ሰላም የለም።", enText: "A country is the sanctuary of its owner; there is no peace away from home.", amAuthor: "የሀገር አባባል", enAuthor: "Country Proverb" },
                    { amText: "ለሀገር መቆም የክብር ሁሉ ከፍታ ነው።", enText: "Standing for one's country is the height of honor.", amAuthor: "ሀገራዊ ፍልስፍና", enAuthor: "National Philosophy" },
                    { amText: "የሀገር ፍቅር ከምድር በላይ ከፍ ያለ ክብር ነው።", enText: "Patriotism is a dignity higher than the earth.", amAuthor: "ባህላዊ ጥበብ", enAuthor: "Cultural Wisdom" },
                    { amText: "ህብረት የሀገር ብርታት ነው።", enText: "Unity is the strength of a country.", amAuthor: "ታሪክ", enAuthor: "History" },
                    { amText: "የሀገርን ሰላም መጠበቅ የሁሉ ሃላፊነት ነው።", enText: "Protecting the peace of the country is everyone's responsibility.", amAuthor: "ህብረተሰብ", enAuthor: "Society" }
                ]
            },
            motivation: {
                nameAm: "🌱 ተነሳሽነት", nameEn: "🌱 Motivation",
                quotes: [
                    { amText: "ትዕግስት የሁሉም ስኬት መሠረት ናት።", enText: "Patience is the foundation of all success.", amAuthor: "ጥንታዊ አባባል", enAuthor: "Ancient Saying" },
                    { amText: "በራስ መተማመን ለስኬት የመጀመሪያው ጀማሪ ነው።", enText: "Self-confidence is the first step to success.", amAuthor: "ስነ-ልቦና", enAuthor: "Psychology" },
                    { amText: "ተስፋ አለመቁረጥ የድል መጀመሪያ ነው።", enText: "Never giving up is the beginning of victory.", amAuthor: "ጀግንነት", enAuthor: "Courage" },
                    { amText: "ድፍረት የፍርሃት አለመኖር ሳይሆን ድል መንሳት ነው።", enText: "Courage is not the absence of fear, but conquering it.", amAuthor: "ፍልስፍና", enAuthor: "Philosophy" },
                    { amText: "ብሩህ አመለካከት በጨለማ ውስጥ ብርሃን ያያል።", enText: "An optimistic attitude sees light in the darkness.", amAuthor: "ተነሳሽነት", enAuthor: "Motivation" }
                ]
            }
        };

        let currentCat = 'love';
        let currentIndex = 0;
        let currentLang = 'am'; // ነባሪ አማርኛ

        const catStripEl = document.getElementById("cat-strip");
        const quoteTextEl = document.getElementById("quote-text");
        const authorEl = document.getElementById("author");
        const nextBtn = document.getElementById("next-btn");
        const prevBtn = document.getElementById("prev-btn");
        const langToggleBtn = document.getElementById("lang-toggle-btn");
        const appTitleEl = document.getElementById("app-title");

        // የምድብ አዝራሮችን በአግድም (Horizontal Strip) መገንባት
        function renderCategories() {
            catStripEl.innerHTML = '';
            Object.keys(categoriesData).forEach(catKey => {
                const cat = categoriesData[catKey];
                const btn = document.createElement('button');
                btn.className = `cat-btn ${catKey === currentCat ? 'active' : ''}`;
                btn.textContent = currentLang === 'am' ? cat.nameAm : cat.nameEn;
                btn.addEventListener('click', () => {
                    currentCat = catKey;
                    currentIndex = 0;
                    renderCategories();
                    renderQuote();
                });
                catStripEl.appendChild(btn);
            });
        }

        // ጥቅሱን ማሳየት (በጣም ለስላሳ እና ፍሊክ የማያደርግ)
        function renderQuote() {
            const quotesList = categoriesData[currentCat].quotes;
            const current = quotesList[currentIndex];

            if (currentLang === 'am') {
                quoteTextEl.textContent = current.amText;
                authorEl.textContent = "- " + current.amAuthor;
                appTitleEl.textContent = "Lightly";
                nextBtn.textContent = "ቀጣይ";
                prevBtn.textContent = "ያለፈው";
                langToggleBtn.textContent = "🇺🇸 English";
            } else {
                quoteTextEl.textContent = current.enText;
                authorEl.textContent = "- " + current.enAuthor;
                appTitleEl.textContent = "Lightly";
                nextBtn.textContent = "Next";
                prevBtn.textContent = "Previous";
                langToggleBtn.textContent = "🇪🇹 አማርኛ";
            }
        }

        // የቋንቋ መቀየሪያ ቁልፍ ሲጫን
        langToggleBtn.addEventListener("click", () => {
            currentLang = currentLang === 'am' ? 'en' : 'am';
            renderCategories();
            renderQuote();
        });

        // ቀጣይ ቁልፍ
        nextBtn.addEventListener("click", () => {
            const quotesList = categoriesData[currentCat].quotes;
            currentIndex = (currentIndex + 1) % quotesList.length;
            renderQuote();
        });

        // ያለፈው ቁልፍ
        prevBtn.addEventListener("click", () => {
            const quotesList = categoriesData[currentCat].quotes;
            currentIndex = (currentIndex - 1 + quotesList.length) % quotesList.length;
            renderQuote();
        });

        // አፑ ሲጀመር
        renderCategories();
        renderQuote();
    </script>
</body>
</html>
