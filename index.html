<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightly - Mood & Quotes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- የቋንቋ መቀየሪያ ቁልፍ (Language Toggle Button) -->
        <div class="top-bar">
            <button id="lang-toggle-btn" class="lang-btn">🇺🇸 English</button>
        </div>

        <h1 id="app-title">Lightly</h1>
        <p id="app-subtitle" class="subtitle">A mood journal app for daily emotional journey.</p>

        <div class="quote-box">
            <!-- ጽሁፉ ከላይ እና ከታች ሳይደባለቅ በአንድ ንጹህ ቦታ ይወጣል -->
            <p id="quote-text" class="quote-content">እየጫነ ነው...</p>
            <span id="author" class="author-name"></span>
        </div>

        <div class="button-group">
            <button id="prev-btn">ያለፈው (Previous)</button>
            <button id="next-btn">ቀጣይ (Next)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
