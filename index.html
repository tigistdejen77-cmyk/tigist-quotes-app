<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightly - Mood & Quotes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div>
            <div class="header-bar">
                <h1 id="app-title">Lightly</h1>
                <button id="lang-btn" class="lang-btn">🇺🇸 English</button>
            </div>
            <p id="app-subtitle" class="subtitle">ለዕለታዊ ስሜታዊ ጉዞዎ የሚሆን የጥቅስ መተግበሪያ።</p>
        </div>

        <!-- አግድም የምድብ አዝራሮች -->
        <div class="categories-strip" id="cat-strip"></div>

        <div class="quote-box">
            <p id="quote-text" class="quote-content">እየጫነ ነው...</p>
            <span id="quote-author" class="author-name"></span>
        </div>

        <div class="button-group">
            <button id="prev-btn" class="action-btn">ያለፈው</button>
            <button id="next-btn" class="action-btn">ቀጣይ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
